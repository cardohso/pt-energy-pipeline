[project]
name = "pt-energy-pipeline"
version = "0.1.0"
description = "Scheduled batch pipeline over open Portuguese electricity data, with data contracts, lineage and quality gates."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "João Pedro Cardoso" }]
dependencies = [
    "duckdb>=1.1",
    "pandera>=0.20",
    "pandas>=2.2",
    "pyarrow>=17",
    "pyyaml>=6",
    "defusedxml>=0.7",
    "httpx>=0.27",
    "jsonschema>=4.22",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "pandas-stubs",
]

[project.scripts]
pt-energy = "pt_energy.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pt_energy"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["network: test that needs the network (never run in CI)"]
filterwarnings = ["ignore:The inplace keyword in DataFrame.drop:Warning"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
ignore_missing_imports = true
