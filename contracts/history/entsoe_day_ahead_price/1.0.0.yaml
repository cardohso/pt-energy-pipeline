name: entsoe_day_ahead_price
version: 1.0.0
status: active
owner: "João Pedro Cardoso (pipeline); publisher is ENTSO-E"
description: >-
  Day-ahead prices for the Portugal bidding zone (document type A44). Cross-checked against OMIE.
source:
  publisher: ENTSO-E Transparency Platform
  url: "https://web-api.tp.entsoe.eu/api"
  licence: "ENTSO-E Terms of Use (2023). Day-ahead prices are not on ENTSO-E's CC BY 4.0 open-data list: reuse needs attribution (clause 3.1) and must not harm the primary data owner (OMIE)."
  attribution: "Source: ENTSO-E Transparency Platform"
grain: "one price per 15-minute market time unit"
resolution_minutes: 15
primary_key: [interval_start_utc]
timezone: UTC
freshness:
  expected_lag_hours: 0
  max_age_hours: 36
fields:
  - name: interval_start_utc
    type: timestamp_utc
    nullable: false
    description: Start of the interval.
  - name: price_eur_mwh
    type: number
    unit: EUR/MWh
    nullable: false
    description: Day-ahead price (ENTSO-E unit name MWH, currency EUR).
    range: {min: -500, max: 4000}
  - name: resolution_minutes
    type: integer
    unit: minutes
    nullable: false
    description: Length of the interval as published. 60 for older hourly days.
    allowed_values: [15, 60]
notes:
  - "Verified 2026-11-09 against real responses for 2026-11-05 and 11-06: 15-minute (PT15M), curve type A03, EUR/MWh. Matched OMIE's Portugal column on 96 of 96 intervals on both days."
  - "Each period covers one Central European day (starts 23:00 or 22:00 UTC the day before). A request for one UTC day returns two overlapping periods; staging picks by interval and keeps the latest version."
  - "A03 series omit points that repeat the previous value: staging expands them."
changelog:
  - version: 1.0.0
    date: "2026-11-09"
    change: "Confirmed against real responses: 15-minute, EUR/MWh, adds resolution_minutes."
    breaking: false
  - version: 0.1.0
    date: "2026-11-07"
    change: "Draft contract, not yet checked against a real payload."
    breaking: false
