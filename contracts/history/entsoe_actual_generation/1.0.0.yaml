name: entsoe_actual_generation
version: 1.0.0
status: active
owner: "João Pedro Cardoso (pipeline); publisher is ENTSO-E"
description: >-
  Actual aggregated generation per production type for the Portugal bidding zone (document type
  A75, process type A16), one series per production type and direction.
source:
  publisher: ENTSO-E Transparency Platform
  url: "https://web-api.tp.entsoe.eu/api"
  licence: "ENTSO-E Terms of Use (2023). Not on ENTSO-E's CC BY 4.0 open-data list: reuse needs attribution (clause 3.1) and must not harm the primary data owner (REN)."
  attribution: "Source: ENTSO-E Transparency Platform"
grain: "one value per production type and direction per hour"
resolution_minutes: 60
primary_key: [interval_start_utc, psr_type, direction]
timezone: UTC
freshness:
  expected_lag_hours: 1
  max_age_hours: 6
fields:
  - name: interval_start_utc
    type: timestamp_utc
    nullable: false
    description: Start of the hourly interval.
  - name: psr_type
    type: string
    nullable: false
    description: ENTSO-E production type code (for example B16 solar, B19 wind onshore, B10 hydro pumped storage).
    allowed_values: [B01, B02, B03, B04, B05, B06, B07, B08, B09, B10, B11, B12, B13, B14, B15, B16, B17, B18, B19, B20]
  - name: direction
    type: string
    nullable: false
    description: "generation (series in the zone's inBiddingZone) or consumption (outBiddingZone, for example pumping)."
    allowed_values: [generation, consumption]
  - name: generation_mw
    type: number
    unit: MW
    nullable: false
    description: Average actual power over the hour (ENTSO-E unit name MAW).
    range: {min: 0, max: 20000}
  - name: resolution_minutes
    type: integer
    unit: minutes
    nullable: false
    description: Length of the interval as published.
    allowed_values: [60]
notes:
  - "Verified 2026-11-09 against real responses for 2026-11-05: hourly (PT60M), unit MAW, curve type A03."
  - "A03 series omit points whose value repeats the previous one: staging expands them before any completeness check."
  - "Types B04, B05, B10, B11 and B12 appeared as both generation and consumption series on 2026-11-05."
  - "Types seen for Portugal on that day: B01, B04, B05, B10, B11, B12, B16, B18, B19, B20."
changelog:
  - version: 1.0.0
    date: "2026-11-09"
    change: "Confirmed against real responses: hourly, adds direction (generation or consumption) to the primary key, adds resolution_minutes, lists allowed production types."
    breaking: false
  - version: 0.1.0
    date: "2026-11-07"
    change: "Draft contract, not yet checked against a real payload."
    breaking: false
