name: omie_day_ahead_price
version: 1.0.0
status: active
owner: "João Pedro Cardoso (pipeline); publisher is OMIE"
description: >-
  Day-ahead market clearing price for the Portuguese bidding zone, as published by OMIE in one
  text file per trading day (marginalpdbcpt).
source:
  publisher: OMIE - Operador do Mercado Ibérico de Energia
  url: "https://www.omie.es/es/file-download?parents=marginalpdbcpt&filename=marginalpdbcpt_YYYYMMDD.1"
  licence: "No explicit licence. OMIE legal notice: cite the source when reusing its information."
  attribution: "Source: OMIE (www.omie.es)"
grain: "one clearing price per hour for the Portuguese bidding zone"
resolution_minutes: 60
primary_key: [delivery_start_utc]
timezone: UTC
source_timezone: Europe/Madrid
freshness:
  expected_lag_hours: 0
  max_age_hours: 36
fields:
  - name: delivery_start_utc
    type: timestamp_utc
    nullable: false
    description: Start of the delivery period, converted from the OMIE trading day in CET/CEST.
  - name: price_pt_eur_mwh
    type: number
    unit: EUR/MWh
    nullable: false
    description: Day-ahead clearing price for Portugal.
    range: {min: -500, max: 4000}
notes:
  - "Hourly files (24 periods per day) up to and including 2025-09-30."
  - "Price range uses the SDAC harmonised bounds as an assumption; verify in step 6."
  - "Column order (PT first, ES second) is assumed from the file layout; verified against ENTSO-E in step 4."
changelog:
  - version: 1.0.0
    date: "2026-11-07"
    change: "Initial contract: hourly Portuguese day-ahead price."
    breaking: false
